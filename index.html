<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Goniometer">
<title>Physio Goniometer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh;padding:env(safe-area-inset-top) 10px calc(10px + env(safe-area-inset-bottom))}
h1{font-size:15px;margin:8px 0;color:#9cf;font-weight:600}
.row{display:flex;gap:8px;margin:6px 0}
select,input{flex:1;font-size:16px;padding:10px;background:#111;color:#fff;border:2px solid #444;border-radius:10px;min-width:0}
.seg{display:flex;flex:1;border:2px solid #444;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;margin:0;background:#111;color:#ccc;font-size:15px;padding:10px}
.seg button.on{background:#ffd400;color:#000;font-weight:700}
#ref{font-size:14px;color:#ccc;min-height:20px;margin:4px 0}
#ref b{color:#ffd400}
#readout{text-align:center;margin:8px 0;padding:10px;border-radius:16px;background:#0a0a0a;border:3px solid #222}
#readout.held{border-color:#ff4d4d}
#angle{font-size:min(28vw,140px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#0f8}
#readout.held #angle{color:#ff6b6b}
#status{font-size:13px;color:#888;margin-top:6px}
#flag{font-size:14px;margin-top:4px;min-height:18px}
button{font-size:18px;font-weight:700;padding:16px 8px;border-radius:14px;border:0;flex:1;background:#2a2a2a;color:#fff}
button:active{filter:brightness(1.4)}
#start{background:#0a84ff}#zero{background:#ffd400;color:#000}#hold{background:#ff3b30}#save{background:#30d158;color:#000}
#log{margin-top:10px;font-size:14px}
#log table{width:100%;border-collapse:collapse}
#log td{border-bottom:1px solid #222;padding:6px 3px;vertical-align:middle}
#log td.a{font-weight:700;color:#0f8;white-space:nowrap}
.del{background:#400;color:#f88;padding:6px 10px;font-size:14px;flex:none}
.small{font-size:15px;padding:12px 6px}
.spacer{flex:1}
.tabs{display:flex;gap:0;border:2px solid #444;border-radius:12px;overflow:hidden;margin:4px 0}
.tabs button{border-radius:0;background:#111;color:#ccc;padding:12px}
.tabs button.on{background:#0a84ff;color:#fff}
#camUI{display:none}
#camWrap{position:relative;background:#0a0a0a;border:3px solid #222;border-radius:16px;overflow:hidden;touch-action:none}
#video,#cv{width:100%;display:block}
#cv{display:none;touch-action:none}
#camAngle{text-align:center;font-size:min(16vw,72px);font-weight:800;color:#0f8;font-variant-numeric:tabular-nums}
#camSub{text-align:center;font-size:14px;color:#aaa}
#camHint{font-size:13px;color:#888;text-align:center;margin:4px 0}
</style></head><body>
<h1>Physio Goniometer / Inclinometer</h1>
<div id="pwaBar" style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px">
<span id="offState" style="flex:1;color:#888">● Checking offline support…</span>
<button id="installBtn" style="display:none;flex:none;font-size:14px;padding:8px 12px;background:#0a84ff">Install app</button></div>
<div id="iosHint" style="display:none;font-size:13px;background:#1c1c1e;border:1px solid #444;border-radius:10px;padding:8px;margin:4px 0">On iPhone: tap <b>Share</b> <span style="font-size:15px">⎋</span> then <b>Add to Home Screen</b> to install and use offline. <a href="#" id="iosX" style="color:#9cf">Dismiss</a></div>

<div class="tabs" id="tabs"><button data-m="sensor" class="on">Sensor</button><button data-m="camera">Camera</button></div>
<div class="row"><select id="joint" aria-label="Joint and movement"></select></div>
<div class="row">
 <div class="seg" id="side"><button data-v="L">Left</button><button data-v="R" class="on">Right</button></div>
 <div class="seg" id="axis"><button data-v="portrait" class="on">Portrait</button><button data-v="landscape">Landscape</button></div>
</div>
<div id="ref"></div>
<div id="sensorUI">
<div id="readout"><div id="angle">--.-°</div><div id="status">Tap Start to enable sensors</div><div id="flag"></div></div>
<div class="spacer"></div>
<div class="row"><button id="start">Start</button></div>
<div class="row"><button id="zero">Zero</button><button id="hold">Hold</button></div>
</div>
<div id="camUI">
<div id="camAngle">--.-°</div><div id="camSub">Capture or load a photo, then tap 3 points</div><div id="flag2" style="text-align:center;font-size:14px;min-height:18px"></div>
<div id="camWrap"><video id="video" playsinline muted autoplay></video><canvas id="cv"></canvas></div>
<div id="camHint">1 proximal landmark · 2 joint axis · 3 distal landmark — drag to adjust</div>
<div class="row"><button id="camLive" style="background:#0a84ff">Live camera</button><button id="camCap" style="background:#ffd400;color:#000">Capture</button></div>
<div class="row"><button class="small" id="camFileBtn">Photo / Upload</button><input type="file" id="camFile" accept="image/*" capture="environment" hidden><button class="small" id="camReset">Reset points</button></div>
<div class="row"><div class="seg" id="camConv"><button data-v="inc" class="on">Included</button><button data-v="sup">180 − angle</button></div><button class="small" id="camPng" style="flex:.7">PNG</button></div>
</div>
<div class="row"><input id="pt" placeholder="Patient initials (optional)" maxlength="8" autocapitalize="characters"><button id="save" style="flex:.6">Save</button></div>
<div class="row"><button class="small" id="csv">Export CSV</button><button class="small" id="clear">Clear log</button></div>
<div id="log"></div>
<script>
(function(){
"use strict";
// AAOS normal reference ranges (degrees)
var J=[
["Shoulder","Flexion",0,180],["Shoulder","Extension",0,60],["Shoulder","Abduction",0,180],
["Shoulder","Internal rotation",0,70],["Shoulder","External rotation",0,90],
["Elbow","Flexion",0,150],["Forearm","Pronation",0,80],["Forearm","Supination",0,80],
["Wrist","Flexion",0,80],["Wrist","Extension",0,70],["Wrist","Radial deviation",0,20],["Wrist","Ulnar deviation",0,30],
["Hip","Flexion",0,120],["Hip","Extension",0,30],["Hip","Abduction",0,45],["Hip","Adduction",0,30],
["Hip","Internal rotation",0,45],["Hip","External rotation",0,45],
["Knee","Flexion",0,135],["Knee","Extension",0,0],
["Ankle","Dorsiflexion",0,20],["Ankle","Plantarflexion",0,50],["Ankle","Inversion",0,35],["Ankle","Eversion",0,15],
["Cervical","Flexion",0,45],["Cervical","Extension",0,45],["Cervical","Lateral flexion",0,45],
["Lumbar","Flexion",0,60],["Lumbar","Extension",0,25],["Lumbar","Lateral flexion",0,25],
["Other","Free measurement",null,null]];
var $=function(id){return document.getElementById(id)};
var sel=$("joint");
J.forEach(function(j,i){var o=document.createElement("option");o.value=i;o.textContent=j[0]+" – "+j[1];sel.appendChild(o)});
var st={side:"R",axis:"portrait",raw:null,filt:null,zero:0,held:false,heldVal:null,running:false,last:0};
var ALPHA=0.15;
try{var p=JSON.parse(localStorage.getItem("gonio_prefs")||"{}");if(p.j!=null)sel.value=p.j;if(p.side)st.side=p.side;if(p.axis)st.axis=p.axis}catch(e){}
function prefs(){try{localStorage.setItem("gonio_prefs",JSON.stringify({j:sel.value,side:st.side,axis:st.axis}))}catch(e){}}
function seg(id,key){var el=$(id);[].forEach.call(el.children,function(b){b.classList.toggle("on",b.dataset.v===st[key]);
 b.onclick=function(){st[key]=b.dataset.v;[].forEach.call(el.children,function(x){x.classList.toggle("on",x===b)});
 if(key==="axis"){st.filt=null;st.zero=0;}prefs();render()}})}
seg("side","side");seg("axis","axis");
function cur(){return J[+sel.value]}
function showRef(){var j=cur();$("ref").innerHTML=j[2]==null?"Free measurement – no reference range":"AAOS normal: <b>"+j[2]+"° – "+j[3]+"°</b> ("+j[0]+" "+j[1].toLowerCase()+")"}
sel.onchange=function(){prefs();showRef();render()};showRef();
// Tilt angle in the plane relevant to how phone lies on limb.
// portrait: rotation about phone's X axis (beta); landscape: about Y axis (gamma) - computed from gravity vector for full 0-360 range.
function tilt(b,g){
 var br=b*Math.PI/180,gr=g*Math.PI/180;
 // gravity in device frame (ZXY intrinsic, alpha irrelevant)
 var gx=-Math.cos(br)*Math.sin(gr), gy=Math.sin(br), gz=Math.cos(br)*Math.cos(gr);
 var a= st.axis==="portrait" ? Math.atan2(gy,gz) : Math.atan2(-gx,gz);
 return a*180/Math.PI;
}
function wrap(a){while(a>180)a-=360;while(a<=-180)a+=360;return a}
function onOri(e){
 if(e.beta==null||e.gamma==null)return;
 var a=tilt(e.beta,e.gamma);st.raw=a;st.last=Date.now();
 if(st.filt==null)st.filt=a;else st.filt=wrap(st.filt+ALPHA*wrap(a-st.filt));
 if(!st.held)render();
}
function val(){if(st.held)return st.heldVal;if(st.filt==null)return null;return wrap(st.filt-st.zero)}
function render(){
 var v=val();
 $("angle").textContent=v==null?"--.-°":Math.abs(v).toFixed(1)+"°";
 $("readout").classList.toggle("held",st.held);
 $("hold").textContent=st.held?"Release":"Hold";
 var f="";var j=cur();
 if(v!=null&&j[2]!=null){var m=Math.abs(v);f=m<j[3]-5?"<span style='color:#ff9f0a'>Below normal (−"+(j[3]-m).toFixed(1)+"°)</span>":m>j[3]+5?"<span style='color:#64d2ff'>Above normal range</span>":"<span style='color:#0f8'>Within normal range</span>"}
 $("flag").innerHTML=f;
 if(st.running)$("status").textContent=(st.held?"HELD":"Live")+" · "+st.axis+" · "+(st.side==="L"?"Left":"Right")+(v!=null&&v<0?" · (−) direction":"");
}
$("start").onclick=function(){
 function go(){window.addEventListener("deviceorientation",onOri,true);st.running=true;$("start").textContent="Sensors on";$("start").style.background="#1c3d6b";
  $("status").textContent="Waiting for sensor data…";
  setTimeout(function(){if(!st.last)$("status").textContent="No sensor data. Needs a phone with motion sensors and HTTPS."},2500)}
 if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
  DeviceOrientationEvent.requestPermission().then(function(r){if(r==="granted")go();else $("status").textContent="Motion permission denied. Enable in Settings › Safari › Motion & Orientation."}).catch(function(err){$("status").textContent="Permission error: "+err})
 }else if(typeof DeviceOrientationEvent==="undefined"){$("status").textContent="DeviceOrientation not supported on this device."}else go();
};
$("zero").onclick=function(){if(st.filt==null)return;st.held=false;st.zero=st.filt;render();buzz()};
$("hold").onclick=function(){if(!st.held){var v=val();if(v==null)return;st.heldVal=v;st.held=true}else st.held=false;render();buzz()};
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
// Log
function load(){try{return JSON.parse(localStorage.getItem("gonio_log")||"[]")}catch(e){return[]}}
function store(l){localStorage.setItem("gonio_log",JSON.stringify(l))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function drawLog(){var l=load();if(!l.length){$("log").innerHTML="<p style='color:#666'>No saved readings.</p>";return}
 var h="<table>";l.slice().reverse().forEach(function(r){var d=new Date(r.t);
  h+="<tr><td>"+esc(d.toLocaleDateString())+" "+esc(d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+"<br><small>"+esc(r.pt||"—")+" · "+esc(r.side)+" "+esc(r.joint)+" "+esc(r.mov)+(r.method==="camera"?" · 📷":"")+"</small></td><td class='a'>"+r.angle.toFixed(1)+"°</td><td><button class='del' data-id='"+r.id+"'>✕</button></td></tr>"});
 $("log").innerHTML=h+"</table>";
 [].forEach.call(document.querySelectorAll(".del"),function(b){b.onclick=function(){if(!confirm("Delete this reading?"))return;store(load().filter(function(r){return String(r.id)!==b.dataset.id}));drawLog()}})}
$("save").onclick=function(){var v=window.__mode==="camera"?window.__camVal():val();if(v==null){alert("No reading yet. Tap Start.");return}var j=cur();
 var l=load();l.push({id:Date.now(),t:new Date().toISOString(),pt:$("pt").value.trim().toUpperCase(),side:st.side==="L"?"Left":"Right",joint:j[0],mov:j[1],angle:Math.round(Math.abs(v)*10)/10,signed:Math.round(v*10)/10,axis:window.__mode==="camera"?"":st.axis,method:window.__mode==="camera"?"camera":"sensor",normal:j[2]==null?"":j[2]+"-"+j[3]});
 store(l);drawLog();buzz()};
$("clear").onclick=function(){if(confirm("Delete ALL saved readings?")){store([]);drawLog()}};
$("csv").onclick=function(){var l=load();if(!l.length){alert("Log is empty.");return}
 var q=function(s){return'"'+String(s).replace(/"/g,'""')+'"'};
 var rows=[["Timestamp","Patient","Side","Joint","Movement","Angle_deg","Signed_deg","Axis","Method","AAOS_normal_deg"]].concat(l.map(function(r){return[r.t,r.pt,r.side,r.joint,r.mov,r.angle,r.signed,r.axis,r.method||"sensor",r.normal]}));
 var csv=rows.map(function(r){return r.map(q).join(",")}).join("\r\n");
 var blob=new Blob(["\ufeff"+csv],{type:"text/csv"});var name="goniometer_"+new Date().toISOString().slice(0,10)+".csv";
 try{var file=new File([blob],name,{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}}catch(e){}
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)};
drawLog();render();
window.__gonio={st:st,val:val};window.__J=J;
})();
</script>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
window.__mode="sensor";
var video=$("video"),cv=$("cv"),ctx=cv.getContext("2d"),img=null,pts=[],drag=-1,conv="inc",stream=null,loupe=null;
[].forEach.call($("tabs").children,function(b){b.onclick=function(){window.__mode=b.dataset.m;
 [].forEach.call($("tabs").children,function(x){x.classList.toggle("on",x===b)});
 $("sensorUI").style.display=b.dataset.m==="sensor"?"":"none";$("camUI").style.display=b.dataset.m==="camera"?"block":"none";
 $("axis").style.visibility=b.dataset.m==="camera"?"hidden":"";if(b.dataset.m!=="camera")stop();}});
[].forEach.call($("camConv").children,function(b){b.onclick=function(){conv=b.dataset.v;[].forEach.call($("camConv").children,function(x){x.classList.toggle("on",x===b)});draw()}});
function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
$("camLive").onclick=function(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("camSub").textContent="Live camera unavailable – use Photo / Upload";return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920}},audio:false}).then(function(s){stop();stream=s;video.srcObject=s;video.style.display="block";cv.style.display="none";video.play();$("camSub").textContent="Aim, then tap Capture"})
 .catch(function(e){$("camSub").textContent="Camera error: "+e.name+" – use Photo / Upload"})};
$("camCap").onclick=function(){if(!stream||!video.videoWidth){$("camSub").textContent="Start Live camera first";return}
 var c=document.createElement("canvas");c.width=video.videoWidth;c.height=video.videoHeight;c.getContext("2d").drawImage(video,0,0);
 var im=new Image();im.onload=function(){setImg(im)};im.src=c.toDataURL("image/jpeg",.92);stop()};
$("camFileBtn").onclick=function(){$("camFile").click()};
$("camFile").onchange=function(e){var f=e.target.files[0];if(!f)return;var im=new Image();im.onload=function(){setImg(im)};im.src=URL.createObjectURL(f);e.target.value=""};
$("camReset").onclick=function(){pts=[];draw()};
function setImg(im){img=im;pts=[];cv.width=im.naturalWidth;cv.height=im.naturalHeight;video.style.display="none";cv.style.display="block";$("camSub").textContent="Tap: proximal, joint axis, distal";draw()}
window.__camSetImg=setImg;
function ang(){if(pts.length<3)return null;var a=pts[0],b=pts[1],c=pts[2];
 var a1=Math.atan2(a.y-b.y,a.x-b.x),a2=Math.atan2(c.y-b.y,c.x-b.x);var d=Math.abs(a1-a2)*180/Math.PI;if(d>180)d=360-d;return d}
window.__camVal=function(){var d=ang();if(d==null)return null;return conv==="inc"?d:180-d};
window.__camPts=function(p){if(p)pts=p;draw();return pts};
function draw(){if(!img)return;var W=cv.width,u=Math.max(W,cv.height)/400;
 ctx.drawImage(img,0,0);ctx.lineCap="round";
 if(pts.length>1){ctx.lineWidth=4*u;ctx.strokeStyle="#ffd400";ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);if(pts[2])ctx.lineTo(pts[2].x,pts[2].y);ctx.stroke()}
 var d=ang();
 if(d!=null){var b=pts[1],a1=Math.atan2(pts[0].y-b.y,pts[0].x-b.x),a2=Math.atan2(pts[2].y-b.y,pts[2].x-b.x),diff=a2-a1;
  while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
  ctx.strokeStyle="#0f8";ctx.lineWidth=3*u;ctx.beginPath();ctx.arc(b.x,b.y,30*u,a1,a1+diff,diff<0);ctx.stroke();
  var v=window.__camVal();ctx.font="bold "+(22*u)+"px system-ui";ctx.fillStyle="#000";ctx.strokeStyle="#000";ctx.lineWidth=5*u;
  var t=v.toFixed(1)+"°",mid=a1+diff/2,tx=b.x+Math.cos(mid)*48*u-20*u,ty=b.y+Math.sin(mid)*48*u+8*u;ctx.strokeText(t,tx,ty);ctx.fillStyle="#0f8";ctx.fillText(t,tx,ty)}
 pts.forEach(function(p,i){ctx.beginPath();ctx.arc(p.x,p.y,9*u,0,7);ctx.fillStyle=i===1?"#ff3b30":"#0a84ff";ctx.fill();ctx.lineWidth=2*u;ctx.strokeStyle="#fff";ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="bold "+(12*u)+"px system-ui";ctx.fillText(String(i+1),p.x-4*u,p.y+4*u)});
 if(loupe){var R=70*u,z=3,lx=loupe.x<W/2?W-R-10*u:R+10*u,ly=R+10*u;
  ctx.save();ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.clip();ctx.drawImage(img,loupe.x-R/z,loupe.y-R/z,2*R/z,2*R/z,lx-R,ly-R,2*R,2*R);
  ctx.strokeStyle="#ff3b30";ctx.lineWidth=1.5*u;ctx.beginPath();ctx.moveTo(lx-R,ly);ctx.lineTo(lx+R,ly);ctx.moveTo(lx,ly-R);ctx.lineTo(lx,ly+R);ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.strokeStyle="#fff";ctx.lineWidth=3*u;ctx.stroke()}
 $("camAngle").textContent=d==null?"--.-°":window.__camVal().toFixed(1)+"°";
 $("camSub").textContent=d==null?(["Tap proximal landmark","Tap joint axis","Tap distal landmark"][pts.length]):"Included "+d.toFixed(1)+"° · 180−angle "+(180-d).toFixed(1)+"°";
 var f="",sel=$("joint");if(d!=null&&window.__J){var j=window.__J[+sel.value];var m=window.__camVal();if(j[2]!=null)f=m<j[3]-5?"<span style='color:#ff9f0a'>Below normal (−"+(j[3]-m).toFixed(1)+"°)</span>":m>j[3]+5?"<span style='color:#64d2ff'>Above normal range</span>":"<span style='color:#0f8'>Within normal range</span>"}
 $("flag2").innerHTML=f}
$("joint").addEventListener("change",draw);
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
cv.addEventListener("pointerdown",function(e){if(!img)return;e.preventDefault();cv.setPointerCapture(e.pointerId);var p=pos(e),r=cv.getBoundingClientRect(),th=30*cv.width/r.width,best=-1,bd=th;
 pts.forEach(function(q,i){var dd=Math.hypot(q.x-p.x,q.y-p.y);if(dd<bd){bd=dd;best=i}});
 if(best<0&&pts.length<3){pts.push(p);best=pts.length-1}drag=best;if(drag>=0){pts[drag]=p;loupe=p}draw()});
cv.addEventListener("pointermove",function(e){if(drag<0)return;e.preventDefault();var p=pos(e);pts[drag]=p;loupe=p;draw()});
function up(){drag=-1;loupe=null;draw()}cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
$("camPng").onclick=function(){if(!img)return;loupe=null;draw();var sel=$("joint"),j=window.__J?window.__J[+sel.value]:["",""];
 var a=document.createElement("a");a.download="goniometer_"+(j[0]+"_"+j[1]).replace(/\W+/g,"_")+"_"+new Date().toISOString().slice(0,19).replace(/:/g,"")+".png";
 cv.toBlob(function(b){a.href=URL.createObjectURL(b);document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000)},"image/png")};
})();
</script>
<script>
(function(){var st=document.getElementById("offState"),ib=document.getElementById("installBtn"),dp=null;
function set(t,c){st.textContent="● "+t;st.style.color=c}
function upd(){if(!navigator.onLine)set("Offline – running from cache","#ff9f0a")}
window.addEventListener("online",function(){chk()});window.addEventListener("offline",upd);
