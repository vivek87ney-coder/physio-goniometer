name: Decode icons
on:
  push:
    paths: ['icons.bundle']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r p b; do [ -n "$p" ] && echo "$b" | base64 -d > "$p"; done < icons.bundle
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A -- '*.png'
          git diff --cached --quiet || (git commit -m "Decode PNG icons" && git push)
