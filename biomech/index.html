<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physio 3D Biomechanics</title><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
button,select,input{font:inherit;color:#fff;background:#262628;border:1px solid #3a3a3c;border-radius:8px;padding:6px 9px;margin:2px}button{cursor:pointer;font-weight:600}
.b{background:#0a84ff;border-color:#0a84ff}.y{background:#ffd400;color:#000;border-color:#ffd400}.on{background:#0a84ff;border-color:#0a84ff}
#start{max-width:560px;margin:0 auto;padding:24px 16px}#start h1{font-size:22px;display:flex;gap:8px;align-items:center}#start h1 img{width:34px;border-radius:8px}
#start .big{display:block;width:100%;padding:16px;font-size:17px;margin:8px 0;text-align:left}#start small{color:#888}
#app{display:none;height:100%;flex-direction:column}#bar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:4px 6px;background:#0d0d0f;border-bottom:1px solid #222}
#bar .t{font-weight:800;margin-right:6px}#bar .sp{flex:1}.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#222;margin:1px}
#grid{flex:1;min-height:0;display:grid;gap:4px;padding:4px;grid-template-columns:1fr 1.25fr 380px;grid-template-areas:"cam atl ana"}
@media(max-width:1250px){#grid{grid-template-columns:1fr 1.2fr;grid-template-rows:auto 1fr;grid-template-areas:"cam atl" "ana atl"}}
.pn{background:#0b0c10;border:1px solid #222;border-radius:10px;min-height:0;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
#pcam{grid-area:cam}#patl{grid-area:atl}#pana{grid-area:ana;overflow:auto}
#vwrap{position:relative;background:#111;flex:1;min-height:180px}#vwrap video{width:100%;height:100%;object-fit:contain;display:block}#vwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.mir{transform:scaleX(-1)}#hud{position:absolute;left:6px;top:6px;right:6px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none;text-shadow:0 1px 2px #000}
#atl{flex:1;width:100%;min-height:260px;display:block;touch-action:none;background:radial-gradient(#1a2333,#05070a)}
#ltools{padding:4px;border-top:1px solid #222;font-size:12px;max-height:45%;overflow:auto}#ltools .lr{display:flex;align-items:center;gap:4px}#ltools .lr span{flex:1}#ltools input[type=range]{width:70px;padding:0}
#selbox{position:absolute;left:6px;top:6px;max-width:70%;background:#000c;border:1px solid #333;border-radius:8px;padding:6px;font-size:12px;display:none}
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px;position:sticky;top:0;background:#0b0c10;z-index:2}#tabs button{padding:5px 8px;font-size:13px}
.tb{padding:6px 8px}.tb table{border-collapse:collapse;width:100%;font-size:12px}.tb td,.tb th{border-bottom:1px solid #222;padding:3px;text-align:left;vertical-align:top}.tb th{color:#9cf}
.tag{font-size:10px;padding:1px 5px;border-radius:6px;white-space:nowrap}.tc{background:#0a3d1f;color:#7ee2a0}.ti{background:#3d2a00;color:#ffcf66}
.muted{color:#888;font-size:12px}.role{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#arc{width:100%;height:240px;display:block;background:radial-gradient(#1a2333,#05070a);border-radius:8px;touch-action:none}
#lic{font-size:10px;color:#777;padding:2px 6px}#mtabs{display:none}
@media(max-width:760px){#grid{display:block;overflow:auto}#mtabs{display:flex;gap:2px;padding:4px}#mtabs button{flex:1}.pn{display:none;height:calc(100vh - 140px)}.pn.show{display:flex}#pana.show{display:block}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<div id="start"><h1><img src="icon-192.png" alt="">Physio 3D Biomechanics</h1>
<p class="muted">No login needed. Choose a camera to start – camera, 3D anatomy and analysis open together on one screen.</p>
<button class="big b" data-cam="user">📱 Front camera (selfie, mirrored)</button><button class="big b" data-cam="environment">📷 Rear camera</button>
<button class="big" data-cam="file">🎞 Analyse a video file</button><button class="big" data-cam="none">🦴 3D anatomy only (no camera)</button>
<p><a href="patients.html" style="color:#9cf">Patient records, sessions & reports (optional, PIN-protected)</a></p>
<p id="offState" class="muted">● Checking offline support…</p></div>
<div id="app"><div id="bar"><span class="t">Biomech3D</span>
<select id="reg"></select><select id="side"><option value="R">Right</option><option value="L">Left</option></select><select id="mot"></select>
<button id="camT" title="Switch front/rear">⟲ Camera</button><span id="viewP" class="pill">view: –</span><span id="poseP" class="pill">pose: –</span><span class="sp"></span>
<button id="saveB">💾 Save</button><a href="patients.html"><button>Patient tools</button></a></div>
<div id="mtabs"><button data-p="pcam" class="on">Camera</button><button data-p="patl">3D</button><button data-p="pana">Analysis</button></div>
<div id="grid">
<div class="pn show" id="pcam"><div id="vwrap"><video id="vid" playsinline muted></video><canvas id="ov"></canvas><div id="hud"></div></div></div>
<div class="pn" id="patl"><canvas id="atl"></canvas><div id="selbox"></div><div id="ltools"></div><div id="lic"></div></div>
<div class="pn" id="pana"><div id="tabs"></div><div id="tbody" class="tb"></div></div>
</div></div>
<input type="file" id="vidPick" accept="video/*" style="display:none">
<script type="module" src="main.js"></script>
<script>
(function(){var st=document.getElementById("offState");function set(t,c){st.textContent="● "+t;st.style.color=c}
if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("sw.js",{scope:"./"}).then(function(){return navigator.serviceWorker.ready}).then(function(){caches.keys().then(function(k){var ok=k.some(function(x){return x.indexOf("biomech-v2")===0});set(ok?"Offline ready (region models cache after first open)":"Preparing offline…",ok?"#30d158":"#888")})}).catch(function(e){set("Offline setup failed: "+e.message,"#ff6b6b")})}else set("Offline mode needs HTTPS","#ff6b6b");})();
</script></body></html>
